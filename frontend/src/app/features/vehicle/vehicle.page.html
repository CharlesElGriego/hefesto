<section class="mx-auto w-full max-w-2xl px-4 pb-10 pt-6 md:pt-10">
  <!-- Garage -->
  <div class="flex items-baseline justify-between">
    <h1 class="font-display text-2xl font-bold tracking-tight">{{ t('g.title') }}</h1>
  </div>

  @if (vehicleFormFor() !== null) {
    <form
      [formGroup]="vf"
      (ngSubmit)="submitVehicle()"
      class="card mt-4 grid grid-cols-2 gap-3 p-4"
    >
      <label class="field">
        <span class="field__label">{{ t('g.make') }}</span>
        <input class="field__control" formControlName="make" placeholder="Toyota" />
        @if (errFor('make'); as e) {
          <span class="field__error">{{ e }}</span>
        }
      </label>
      <label class="field">
        <span class="field__label">{{ t('g.model') }}</span>
        <input class="field__control" formControlName="model" placeholder="Hilux" />
        @if (errFor('model'); as e) {
          <span class="field__error">{{ e }}</span>
        }
      </label>
      <label class="field">
        <span class="field__label">{{ t('g.year') }}</span>
        <input class="field__control" formControlName="year" type="number" />
        @if (errFor('year'); as e) {
          <span class="field__error">{{ e }}</span>
        }
      </label>
      <label class="field">
        <span class="field__label">{{ t('g.plate') }}</span>
        <input class="field__control" formControlName="plate" [placeholder]="t('g.optional')" />
        @if (errFor('plate'); as e) {
          <span class="field__error">{{ e }}</span>
        }
      </label>
      <label class="field col-span-2">
        <span class="field__label">{{ t('g.mileage') }}</span>
        <input class="field__control" formControlName="currentMileage" type="number" />
        @if (errFor('currentMileage'); as e) {
          <span class="field__error">{{ e }}</span>
        }
      </label>
      <div class="col-span-2 flex justify-end gap-2">
        <button type="button" (click)="vehicleFormFor.set(null)" class="btn--ghost">
          {{ t('g.cancel') }}
        </button>
        <button type="submit" class="btn--primary">
          {{ t(vehicleFormFor() === 'new' ? 'g.addVehicleSubmit' : 'g.save') }}
        </button>
      </div>
    </form>
  }

  <div class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-3">
    @for (v of garage.vehicles(); track v.id) {
      <div
        class="card card--hover relative p-4"
        [class]="garage.selected()?.id === v.id ? 'ring-2 ring-accent' : ''"
      >
        @if (garage.selected()?.id === v.id) {
          <span
            class="absolute right-2.5 top-2.5 grid size-5 place-items-center rounded-full bg-accent text-surface"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-3"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
        }
        <button
          type="button"
          (click)="openVehicle(v)"
          [attr.aria-label]="t('g.selectAria') + ' ' + v.make + ' ' + v.model"
          class="block w-full text-left"
        >
          <span
            class="grid size-10 place-items-center rounded-xl bg-accent-tint text-xl"
            aria-hidden="true"
            >🚗</span
          >
          <p class="mt-2.5 truncate text-sm font-semibold leading-snug">
            {{ v.make }} {{ v.model }}
          </p>
          <p class="tabular mt-0.5 truncate text-xs text-ink-soft">
            {{ v.year }}
            @if (v.plate) {
              · {{ v.plate }}
            }
          </p>
          <p class="tabular mt-1.5 text-[13px] font-semibold">
            {{ v.currentMileage.toLocaleString() }}
            <span class="font-normal text-ink-faint">km</span>
          </p>
        </button>
        <div class="mt-3 flex items-center gap-1 border-t border-line pt-2">
          <button
            type="button"
            (click)="startEditVehicle(v)"
            [attr.aria-label]="t('g.editV')"
            class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-sunken hover:text-ink"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-3.5"
            >
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
          </button>
          @if (garage.multi()) {
            <button
              type="button"
              (click)="confirmDeleteVehicleId.set(v.id)"
              [attr.aria-label]="t('g.delV')"
              class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-sunken hover:text-danger"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-3.5"
              >
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              </svg>
            </button>
          }
        </div>
      </div>
    }
    @if (vehicleFormFor() === null) {
      <button
        type="button"
        (click)="startAddVehicle()"
        class="grid min-h-[150px] place-items-center rounded-[14px] border-2 border-dashed border-line p-4 text-sm font-medium text-ink-faint transition-colors hover:border-accent hover:text-accent-deep"
      >
        {{ t('g.addVehicle') }}
      </button>
    }
  </div>

  <app-confirm-dialog
    [open]="confirmDeleteVehicleId() !== null"
    [title]="t('dlg.deleteVehicleTitle')"
    [message]="
      t('dlg.deleteVehicleMsg', {
        name: pendingDeleteVehicle()?.make + ' ' + pendingDeleteVehicle()?.model,
      })
    "
    [confirmLabel]="t('dlg.delete')"
    [cancelLabel]="t('g.cancel')"
    (confirmed)="deleteVehicle(confirmDeleteVehicleId()!)"
    (cancelled)="confirmDeleteVehicleId.set(null)"
  />
</section>
